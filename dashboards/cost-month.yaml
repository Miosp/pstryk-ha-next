type: custom:apexcharts-card
header:
  title: Pstryk — koszt miesiąca (PLN brutto)
  show: true
  show_states: true
  colorize_states: true
graph_span: 1month
span:
  start: month
series:
  - entity: sensor.pstryk_cost_month
    type: column
    name: Koszt dnia
    unit: PLN
    data_generator: |
      const daily = entity.attributes.daily || [];
      return daily.map(d => [new Date(d.start + "T00:00:00").getTime(), d.cost]);
  - entity: sensor.pstryk_cost_month
    type: line
    name: Prognoza miesiąca
    unit: PLN
    extend_to: end
    data_generator: |
      const now = new Date().getTime();
      const forecast = entity.attributes.forecast;
      const current = parseFloat(entity.state);
      if (!isFinite(current) || forecast === undefined || forecast === null) return [];
      const endOfMonth = new Date(); endOfMonth.setMonth(endOfMonth.getMonth() + 1, 0);
      endOfMonth.setHours(23, 59, 59, 999);
      return [[now, current], [endOfMonth.getTime(), forecast]];
apex_config:
  chart:
    height: 300
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
