type: custom:apexcharts-card
header:
  title: Pstryk — koszt miesiąca (PLN brutto)
  show: true
  show_states: true
  colorize_states: true
graph_span: 1month
span:
  start: month
series:
  - entity: sensor.pstryk_cost_month
    type: column
    name: Koszt dnia
    unit: PLN
    data_generator: |
      const daily = entity.attributes.daily || [];
      return daily.map(d => [new Date(d.start + "T00:00:00").getTime(), d.cost]);
  - entity: sensor.pstryk_cost_month
    type: line
    name: Narastająco (z prognozą)
    unit: PLN
    curve: straight
    data_generator: |
      const daily = entity.attributes.daily || [];
      let sum = 0;
      const pts = daily.map(d => {
        sum += d.cost;
        return [new Date(d.start + "T00:00:00").getTime(), Math.round(sum * 100) / 100];
      });
      const forecast = entity.attributes.forecast;
      if (forecast !== undefined && forecast !== null) {
        const eom = new Date();
        eom.setMonth(eom.getMonth() + 1, 0);
        eom.setHours(23, 59, 59, 999);
        pts.push([eom.getTime(), forecast]);
      }
      return pts;
apex_config:
  chart:
    height: 300
  yaxis:
    - seriesName: Koszt dnia
      decimalsInFloat: 1
    - seriesName: Narastająco (z prognozą)
      opposite: true
      decimalsInFloat: 0
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
