type: custom:apexcharts-card
header:
  title: Pstryk — cena vs zużycie (dziś)
  show: true
  show_states: true
  colorize_states: true
graph_span: 24h
span:
  end: day
yaxis:
  - id: kwh
    decimals: 2
  - id: cena
    decimals: 2
    opposite: true
  - id: koszt
    decimals: 1
series:
  - entity: sensor.pstryk_consumption_today
    type: column
    name: Zużycie kWh
    unit: kWh
    yaxis_id: kwh
    show:
      in_header: raw
    data_generator: |
      const hourly = entity.attributes.hourly || [];
      return hourly.map(h => [new Date(h.start).getTime(), h.kwh]);
  - entity: sensor.pstryk_current_price
    type: line
    name: Cena PLN/kWh
    yaxis_id: cena
    show:
      in_header: raw
    curve: stepline
    data_generator: |
      const today = entity.attributes.today_prices || [];
      return today
        .filter(p => p.gross !== null)
        .map(p => [new Date(p.start).getTime(), p.gross]);
  - entity: sensor.pstryk_consumption_today
    type: line
    name: Koszt narastająco
    unit: PLN
    yaxis_id: koszt
    show:
      in_header: false
    curve: straight
    stroke_width: 2
    data_generator: |
      const hourly = entity.attributes.hourly || [];
      let sum = 0;
      return hourly.map(h => {
        sum += h.cost;
        return [new Date(h.start).getTime(), Math.round(sum * 100) / 100];
      });
apex_config:
  chart:
    height: 300
  tooltip:
    y:
      formatter: |
        EVAL:function(value) {
          return value.toFixed(2);
        }
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
