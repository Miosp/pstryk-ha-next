type: custom:apexcharts-card
header:
  title: Pstryk — cena vs zużycie (dziś)
  show: true
graph_span: 24h
span:
  end: day
yaxis:
  - id: kwh
    decimals: 2
    min: 0
    apex_config:
      title:
        text: Zużycie (kWh)
  - id: cena
    decimals: 2
    min: 0
    opposite: true
    apex_config:
      title:
        text: Cena (PLN/kWh)
series:
  - entity: sensor.pstryk_consumption_today
    type: column
    name: Zużycie kWh
    float_precision: 2
    unit: kWh
    yaxis_id: kwh
    show:
      legend_value: false
    data_generator: |
      const hourly = entity.attributes.hourly || [];
      return hourly.map(h => [new Date(h.start).getTime(), h.kwh]);
  - entity: sensor.pstryk_current_price
    type: line
    name: Cena PLN/kWh
    float_precision: 2
    yaxis_id: cena
    show:
      legend_value: false
    curve: stepline
    data_generator: |
      const today = entity.attributes.today_prices || [];
      return today
        .filter(p => p.gross !== null)
        .map(p => [new Date(p.start).getTime(), p.gross]);
apex_config:
  chart:
    height: 300
  legend:
    show: false
  plotOptions:
    bar:
      columnWidth: 60%
  tooltip:
    y:
      formatter: |
        EVAL:function(value) {
          return value.toFixed(2);
        }
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
