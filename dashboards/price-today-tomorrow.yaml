type: custom:apexcharts-card
header:
  title: Pstryk — ceny 48h (PLN/kWh brutto)
  show: true
  show_states: true
  colorize_states: true
graph_span: 48h
span:
  end: day
  offset: "+24h"
now:
  show: true
  label: Teraz
  color: "#ff9800"
yaxis:
  - decimals: 2
series:
  - entity: sensor.pstryk_current_price
    type: column
    name: Cena
    show:
      legend_value: false
      in_header: raw
    data_generator: |
      const attrs = entity.attributes;
      const all = (attrs.today_prices || []).concat(attrs.tomorrow_prices || [])
        .filter(p => p.gross !== null);
      return all.map(p => [new Date(p.start).getTime(), p.gross]);
apex_config:
  chart:
    height: 300
  plotOptions:
    bar:
      columnWidth: 60%
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
  tooltip:
    x:
      format: d MMM HH:mm
    y:
      formatter: |
        EVAL:function(value) {
          return value.toFixed(2);
        }
