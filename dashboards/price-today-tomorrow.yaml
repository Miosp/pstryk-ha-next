type: custom:apexcharts-card
header:
  title: Pstryk — ceny 48h (PLN/kWh brutto)
  show: true
graph_span: 48h
span:
  end: day
  offset: "+24h"
series:
  - entity: sensor.pstryk_current_price
    type: column
    name: Cena
    show:
      legend_value: false
    data_generator: |
      const attrs = entity.attributes;
      const all = (attrs.today_prices || []).concat(attrs.tomorrow_prices || [])
        .filter(p => p.gross !== null);
      return all.map(p => [new Date(p.start).getTime(), p.gross]);
  - entity: sensor.pstryk_current_price
    type: column
    name: Teraz
    color: "#ff9800"
    show:
      legend_value: false
    data_generator: |
      const attrs = entity.attributes;
      const all = (attrs.today_prices || []).concat(attrs.tomorrow_prices || [])
        .filter(p => p.gross !== null);
      const now = Date.now();
      const cur = all.find(p => {
        const t = new Date(p.start).getTime();
        return t <= now && t + 3600000 > now;
      });
      return cur ? [[new Date(cur.start).getTime(), cur.gross]] : [];
apex_config:
  chart:
    height: 300
  plotOptions:
    bar:
      columnWidth: 90%
  yaxis:
    - decimalsInFloat: 2
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
  tooltip:
    x:
      format: d MMM HH:mm
